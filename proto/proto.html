<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Managelog - Шапка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Involve';
            src: url('../public/fonts/Involve-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Involve';
            src: url('../public/fonts/Involve-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }

        @font-face {
            font-family: 'Involve';
            src: url('../public/fonts/Involve-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
        }

        @font-face {
            font-family: 'Involve';
            src: url('../public/fonts/Involve-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        body {
            font-family: 'Involve', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px 20px 0;
        }

        .content {
            width: 95hv;
            min-height: calc(100vh - 91px);
        }

        .header-container {
            width: 95hv;
            margin: 0 auto;
            position: relative;
            height: 71px;
            padding: 0 3px;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 71px;
            background: rgba(145, 33, 56, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
        }

        .header-content {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.38rem;
        }

        /* Логотип */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 24px;
            text-transform: lowercase;
        }

        .logo-circle {
            width: 55px;
            height: 55px;
            background: #E1EAF8;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 40px;
            font-weight: 600;
            color: #E1EAF8;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        /* Навигация */
        .nav-menu {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-item {
            min-width: 140px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            color: #E1EAF8;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 0.8px;
            padding: 0 20px;
        }

        .nav-item.active {
            background-image: url('../public/images/backgrounds/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
        }

        /* Правая секция */
        .right-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notification-btn {
            width: 48px;
            height: 48px;
            background: #912138;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .notification-icon {
            width: 24px;
            height: 24px;
            fill: #E1EAF8;
        }

        .checkin-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(145, 33, 56, 0.85);
            border-radius: 80px;
            padding: 0 24px;
            height: 48px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkin-icon {
            width: 18px;
            height: 22px;
            fill: #E1EAF8;
        }

        .checkin-text {
            color: #E1EAF8;
            font-size: 18px;
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            border: 3px solid #912138;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Адаптивность */
        @media (max-width: 1400px) {
            .header-container {
                max-width: 100%;
            }
        }

        @media (max-width: 1280px) {
            .logo-text {
                font-size: 40px;
            }

            .nav-item {
                min-width: 120px;
                font-size: 17px;
            }

            .checkin-text {
                font-size: 17px;
            }
        }

        @media (max-width: 1100px) {
            .logo-text {
                font-size: 36px;
            }

            .logo-circle {
                width: 45px;
                height: 45px;
            }

            .nav-item {
                min-width: 110px;
                font-size: 16px;
            }

            .checkin-text {
                font-size: 16px;
            }
        }

        @media (max-width: 900px) {
            .logo-text {
                font-size: 32px;
            }

            .nav-item {
                min-width: 100px;
                font-size: 15px;
            }

            .checkin-text {
                display: none;
            }

            .checkin-btn {
                padding: 0;
                width: 36px;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .logo-section {
                gap: 12px;
            }

            .logo-text {
                font-size: 28px;
            }

            .logo-circle {
                width: 40px;
                height: 40px;
            }

            .nav-menu {
                position: static;
                transform: none;
                flex: 1;
                justify-content: center;
                gap: 4px;
            }

            .header-content {
                gap: 12px;
            }

            .nav-item {
                min-width: 90px;
                font-size: 14px;
            }

            .right-section {
                gap: 8px;
            }
        }

        @media (max-width: 640px) {
            .logo-text {
                font-size: 24px;
            }

            .nav-item {
                min-width: 70px;
                font-size: 12px;
            }
        }

        /* Footer Styles */
        .footer-container {
            width: 100vw;
            margin: 0;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        .footer-bg {
            background: rgba(145, 33, 56, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 0;
            padding: 24px 36px;
        }

        .footer-content {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* Footer Logo */
        .footer-logo {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .footer-logo-circle {
            width: 35.25px;
            height: 35.25px;
            background: #E1EAF8;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .footer-logo-text {
            font-size: 30.76px;
            font-weight: 700;
            color: #E1EAF8;
            white-space: nowrap;
        }

        /* Footer Main */
        .footer-main {
            display: flex;
            gap: 24px;
            flex: 1;
            align-items: flex-start;
        }

        .footer-columns {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            flex: 1;
        }

        .footer-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-column-title {
            font-size: 24px;
            color: #E1EAF8;
            letter-spacing: 1.2px;
            margin-bottom: 0;
        }

        .footer-link {
            font-size: 15px;
            color: white;
            letter-spacing: 0.75px;
            text-decoration: none;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        .footer-link:hover {
            opacity: 0.8;
        }

        /* Footer Right */
        .footer-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 132px;
            width: 359px;
            flex-shrink: 0;
        }

        .footer-social {
            display: flex;
            gap: 12px;
        }

        .footer-social-btn {
            width: 48px;
            height: 48px;
            background: #912138;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .footer-social-btn:hover {
            transform: scale(1.05);
        }

        .footer-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 0 0;
        }

        .footer-copyright-icon {
            width: 24px;
            height: 24px;
            fill: #E1EAF8;
        }

        .footer-copyright-text {
            font-size: 15px;
            color: #E1EAF8;
            letter-spacing: 0.75px;
        }

        /* Footer Responsive */
        @media (max-width: 1200px) {
            .footer-right {
                width: 280px;
            }
        }

        @media (max-width: 1024px) {
            .footer-bg {
                padding: 12px 24px;
            }

            .footer-columns {
                gap: 16px;
            }

            .footer-logo-text {
                font-size: 24px;
            }

            .footer-logo-circle {
                width: 28px;
                height: 28px;
            }

            .footer-column-title {
                font-size: 20px;
            }

            .footer-link {
                font-size: 13px;
            }

            .footer-right {
                width: 240px;
                height: auto;
                gap: 20px;
            }

            .footer-social-btn {
                width: 40px;
                height: 40px;
            }

            .footer-copyright-text {
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            .footer-content {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .footer-main {
                flex-direction: column;
                width: 100%;
            }

            .footer-columns {
                grid-template-columns: 1fr;
                width: 100%;
            }

            .footer-right {
                width: 100%;
            }

            .footer-bottom {
                justify-content: space-between;
            }

            .footer-logo {
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .footer-bg {
                padding: 12px 16px;
            }

            .footer-logo-text {
                font-size: 20px;
            }

            .footer-logo-circle {
                width: 24px;
                height: 24px;
            }

            .footer-column-title {
                font-size: 18px;
            }

            .footer-link {
                font-size: 12px;
            }

            .footer-copyright-text {
                font-size: 11px;
            }

            .footer-social-btn {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
