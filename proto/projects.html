<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Managelog - Шапка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Involve';
            src: local('Arial'), local('Helvetica');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Involve';
            src: local('Arial'), local('Helvetica');
            font-weight: 700;
        }

        body {
            font-family: 'Involve', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header-container {
            max-width: 95hv;
            margin: 0 auto;
            position: relative;
            height: 71px;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 71px;
            background: rgba(145, 33, 56, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
        }

        .header-content {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        /* Логотип */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-left: 0px;
        }

        .logo-circle {
            width: 55px;
            height: 55px;
            background: #E1EAF8;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 700;
            color: #E1EAF8;
            white-space: nowrap;
        }

        /* Навигация */
        .nav-menu {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 0;
            align-items: center;
        }

        .nav-item {
            width: 150px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            color: #E1EAF8;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            text-decoration: none;
        }

        .nav-item.active {
            background-image: url('../public/images/backgrounds/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
        }

        /* Правая секция */
        .right-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-btn {
            width: 40px;
            height: 40px;
            background: #912138;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .notification-icon {
            width: 28px;
            height: 28px;
            fill: #E1EAF8;
        }

        .checkin-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #912138;
            border-radius: 80px;
            padding: 0 20px;
            height: 40px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkin-icon {
            width: 17px;
            height: 20px;
            fill: #E1EAF8;
        }

        .checkin-text {
            color: #E1EAF8;
            font-size: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Адаптивность */
        @media (max-width: 1400px) {
            .header-container {
                max-width: 100%;
            }
        }

        @media (max-width: 1280px) {
            .logo-text {
                font-size: 40px;
            }

            .nav-item {
                width: 130px;
                font-size: 18px;
            }

            .checkin-text {
                font-size: 18px;
            }
        }

        @media (max-width: 1100px) {
            .logo-text {
                font-size: 36px;
            }

            .logo-circle {
                width: 45px;
                height: 45px;
            }

            .nav-item {
                width: 110px;
                font-size: 16px;
            }

            .checkin-text {
                font-size: 16px;
            }
        }

        @media (max-width: 900px) {
            .logo-text {
                font-size: 32px;
            }

            .nav-item {
                width: 100px;
                font-size: 15px;
            }

            .checkin-text {
                display: none;
            }

            .checkin-btn {
                padding: 0;
                width: 36px;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .logo-section {
                gap: 12px;
            }

            .logo-text {
                font-size: 28px;
            }

            .logo-circle {
                width: 40px;
                height: 40px;
            }

            .nav-menu {
                position: static;
                transform: none;
                flex: 1;
                justify-content: center;
                gap: 4px;
            }

            .header-content {
                gap: 12px;
            }

            .nav-item {
                width: 90px;
                font-size: 14px;
            }

            .right-section {
                gap: 8px;
            }
        }

        @media (max-width: 640px) {
            .logo-text {
                font-size: 24px;
            }

            .nav-item {
                width: 70px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
