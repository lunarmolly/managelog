<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Managelog - Шапка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Involve';
            src: local('Arial'), local('Helvetica');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Involve';
            src: local('Arial'), local('Helvetica');
            font-weight: 700;
        }

        body {
            font-family: 'Involve', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header-container {
            max-width: 95vw;
            margin: 0 auto;
            position: relative;
            height: 71px;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 71px;
            background: rgba(145, 33, 56, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
        }

        .header-content {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        /* Логотип */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-left: 0px;
        }

        .logo-circle {
            width: 55px;
            height: 55px;
            background: #E1EAF8;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 700;
            color: #E1EAF8;
            white-space: nowrap;
        }

        /* Навигация */
        .nav-menu {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 0;
            align-items: center;
        }

        .nav-item {
            width: 150px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            color: #E1EAF8;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            text-decoration: none;
        }

        .nav-item.active {
            background-image: url('../public/images/backgrounds/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
        }

        /* Правая секция */
        .right-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-btn {
            width: 40px;
            height: 40px;
            background: #912138;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .notification-icon {
            width: 28px;
            height: 28px;
            fill: #E1EAF8;
        }

        .checkin-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #912138;
            border-radius: 80px;
            padding: 0 20px;
            height: 40px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkin-icon {
            width: 17px;
            height: 20px;
            fill: #E1EAF8;
        }

        .checkin-text {
            color: #E1EAF8;
            font-size: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Адаптивность */
        @media (max-width: 1400px) {
            .header-container {
                max-width: 100%;
            }
        }

        @media (max-width: 1280px) {
            .logo-text {
                font-size: 40px;
            }

            .nav-item {
                width: 130px;
                font-size: 18px;
            }

            .checkin-text {
                font-size: 18px;
            }
        }

        @media (max-width: 1100px) {
            .logo-text {
                font-size: 36px;
            }

            .logo-circle {
                width: 45px;
                height: 45px;
            }

            .nav-item {
                width: 110px;
                font-size: 16px;
            }

            .checkin-text {
                font-size: 16px;
            }
        }

        @media (max-width: 900px) {
            .logo-text {
                font-size: 32px;
            }

            .nav-item {
                width: 100px;
                font-size: 15px;
            }

            .checkin-text {
                display: none;
            }

            .checkin-btn {
                padding: 0;
                width: 36px;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .logo-section {
                gap: 12px;
            }

            .logo-text {
                font-size: 28px;
            }

            .logo-circle {
                width: 40px;
                height: 40px;
            }

            .nav-menu {
                position: static;
                transform: none;
                flex: 1;
                justify-content: center;
                gap: 4px;
            }

            .header-content {
                gap: 12px;
            }

            .nav-item {
                width: 90px;
                font-size: 14px;
            }

            .right-section {
                gap: 8px;
            }
        }

        @media (max-width: 640px) {
            .logo-text {
                font-size: 24px;
            }

            .nav-item {
                width: 70px;
                font-size: 12px;
            }
        }

        /* Секция фильтров и сортировки */
        .filters-container {
            max-width: 95vw;
            margin: 24px auto 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 100;
        }

        .filters-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-btn, .sort-btn {
            background: rgba(145, 33, 56, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            overflow: visible;
            padding: 0;
        }

        .filter-btn {
            min-width: fit-content;
        }

        .sort-btn {
            min-width: fit-content;
        }

        .filter-btn-inner, .sort-btn-inner {
            background: #912138;
            border-radius: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            padding: 12px 24px;
            gap: 10px;
            flex-shrink: 0;
        }

        .filter-text, .sort-text {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 500;
            white-space: nowrap;
            text-align: center;
        }

        .filter-icon, .sort-icon {
            width: 1.5rem;
            height: 1.5rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .filter-icon svg, .sort-icon svg {
            width: 100%;
            height: 100%;
            display: block;
            margin: 0;
        }

        .plus-icon {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plus-icon svg {
            width: 100%;
            height: 100%;
            stroke: #ffffff;
            fill: none;
        }

        .create-project-btn {
            background: #912138;
            border-radius: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            gap: 20px;
            cursor: pointer;
            min-width: fit-content;
        }

        .create-project-text {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 500;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }

        /* Выпадающие меню */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: rgba(145, 33, 56, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 12px 0;
            min-width: 200px;
            z-index: 10000;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            padding: 12px 24px;
            color: #E1EAF8;
            font-size: 1.125rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .dropdown-item .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #E1EAF8;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dropdown-item.active .checkbox {
            border-color: #ffffff;
            background: #ffffff;
        }

        .dropdown-item .checkbox svg {
            width: 12px;
            height: 12px;
            stroke: #912138;
            fill: none;
            display: none;
        }

        .dropdown-item.active .checkbox svg {
            display: block;
            stroke: #912138;
        }

        .filter-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 12px 0;
        }

        .apply-btn {
            flex: 1;
            padding: 10px 20px;
            background: #912138;
            border-radius: 20px;
            color: #ffffff;
            font-size: 1.125rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .apply-btn:hover {
            background: #a02a43;
        }

        .reset-filters-btn {
            padding: 10px 20px;
            background: #912138;
            border-radius: 20px;
            color: #ffffff;
            font-size: 1.125rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .reset-filters-btn:hover {
            background: #a02a43;
        }

        .reset-filters-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-filters-icon svg {
            width: 100%;
            height: 100%;
            stroke: #ffffff;
            fill: none;
        }

        .filter-btn .dropdown-menu {
            padding-bottom: 8px;
        }

        .sort-btn .dropdown-menu {
            min-width: 220px;
        }

        .filter-btn .dropdown-menu {
            min-width: 280px;
            max-width: 400px;
        }

        /* Подменю фильтров */
        .filter-submenu {
            display: none;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
        }

        .filter-submenu.active {
            display: block;
        }

        .filter-submenu,
        .filter-search,
        .filter-results,
        .filter-status-list {
            pointer-events: auto;
        }

        .filter-search {
            padding: 8px 24px;
            margin-bottom: 8px;
        }

        .filter-search-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 400;
            font-family: 'Involve', Arial, sans-serif;
        }

        .filter-search-input::placeholder {
            color: rgba(225, 234, 248, 0.6);
        }

        .filter-search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .filter-results {
            max-height: 200px;
            overflow-y: auto;
            padding: 0 12px;
        }

        .filter-result-item {
            padding: 8px 12px;
            color: #E1EAF8;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .filter-result-item * {
            pointer-events: none;
        }

        .filter-result-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .filter-result-item.selected {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .filter-result-item .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #E1EAF8;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .filter-result-item.selected .checkbox {
            border-color: #ffffff;
            background: #ffffff;
        }

        .filter-result-item .checkbox svg {
            width: 12px;
            height: 12px;
            stroke: #912138;
            fill: none;
            display: none;
        }

        .filter-result-item.selected .checkbox svg {
            display: block;
        }

        .filter-status-list {
            padding: 8px 0;
        }

        .filter-status-item {
            padding: 8px 24px;
            color: #E1EAF8;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .filter-status-item * {
            pointer-events: none;
        }

        .filter-status-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .filter-status-item.selected {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .filter-status-item .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #E1EAF8;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .filter-status-item.selected .checkbox {
            border-color: #ffffff;
            background: #ffffff;
        }

        .filter-status-item .checkbox svg {
            width: 12px;
            height: 12px;
            stroke: #912138;
            fill: none;
            display: none;
        }

        .filter-status-item.selected .checkbox svg {
            display: block;
        }

        .dropdown-item.expandable {
            position: relative;
        }

        .dropdown-item.expandable::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 5px solid #E1EAF8;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            margin-left: auto;
            transition: transform 0.2s;
        }

        .dropdown-item.expandable.expanded::after {
            transform: rotate(90deg);
        }

        /* Адаптивность для секции фильтров */
        @media (max-width: 1280px) {
            .filter-text, .sort-text, .create-project-text {
                font-size: 1.125rem;
            }

            .filter-btn-inner, .sort-btn-inner {
                padding: 12px 20px;
            }

            .filter-icon, .sort-icon {
                width: 1.5rem;
                height: 1.5rem;
                padding-right: 0.5rem;
                padding-left: 0.2rem;
            }

            .dropdown-item {
                font-size: 1rem;
            }

            .filter-search-input {
                font-size: 0.9375rem;
            }

            .filter-result-item, .filter-status-item {
                font-size: 0.9375rem;
            }

            .apply-btn, .reset-filters-btn {
                font-size: 1rem;
                padding: 8px 16px;
            }
        }

        @media (max-width: 1100px) {
            .filter-text, .sort-text, .create-project-text {
                font-size: 1rem;
            }

            .filter-btn-inner, .sort-btn-inner {
                padding: 12px 18px;
            }

            .filter-icon, .sort-icon {
                width: 1.5rem;
                height: 1.5rem;
                padding-right: 0.375rem;
                padding-left: 0.125rem;
            }

            .filter-btn-inner, .sort-btn-inner {
                gap: 8px;
            }

            .dropdown-item {
                font-size: 0.9375rem;
                padding: 10px 20px;
            }

            .filter-search {
                padding: 6px 20px;
            }

            .filter-search-input {
                font-size: 0.875rem;
                padding: 6px 10px;
            }

            .filter-result-item, .filter-status-item {
                font-size: 0.875rem;
                padding: 6px 10px;
            }

            .apply-btn, .reset-filters-btn {
                font-size: 0.9375rem;
                padding: 8px 14px;
            }

            .reset-filters-icon {
                width: 16px;
                height: 16px;
            }
        }

        @media (max-width: 900px) {
            .filters-container {
                flex-wrap: wrap;
            }

            .create-project-btn {
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
            }

            .filter-btn .dropdown-menu {
                min-width: 260px;
                max-width: 100%;
            }

            .sort-btn .dropdown-menu {
                min-width: 200px;
            }
        }

        @media (max-width: 768px) {
            .filters-container {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-left {
                width: 100%;
                justify-content: space-between;
            }

            .filter-btn, .sort-btn {
                flex: 1;
                max-width: 48%;
                background: #912138;
                border-radius: 40px;
                height: 48px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 24px;
                gap: 20px;
                min-width: fit-content;
            }

            .filter-btn-inner, .sort-btn-inner {
                width: 100%;
                background: transparent;
                padding: 0;
                gap: 20px;
                height: auto;
                border-radius: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .filter-text, .sort-text {
                color: #ffffff;
                font-size: 0.9375rem;
                font-weight: 500;
                white-space: nowrap;
                flex: 1;
                text-align: center;
            }

            .filter-icon, .sort-icon {
                width: 1.25rem;
                height: 1.25rem;
                padding: 0;
                flex-shrink: 0;
                margin: 0;
            }

            .create-project-btn {
                width: 100%;
            }

            .create-project-text {
                font-size: 0.9375rem;
            }

            .filter-btn .dropdown-menu {
                min-width: 100%;
                max-width: 100%;
            }

            .sort-btn .dropdown-menu {
                min-width: 100%;
            }

            .dropdown-item {
                font-size: 0.875rem;
                padding: 10px 16px;
            }

            .filter-search {
                padding: 6px 16px;
            }

            .filter-search-input {
                font-size: 0.875rem;
            }

            .filter-result-item, .filter-status-item {
                font-size: 0.875rem;
                padding: 6px 10px;
            }

            .apply-btn, .reset-filters-btn {
                font-size: 0.875rem;
                padding: 8px 12px;
            }

            .filter-actions {
                margin: 8px 8px 0;
                gap: 6px;
            }
        }

        @media (max-width: 640px) {
            .filter-btn, .sort-btn {
                padding: 12px 20px;
                gap: 16px;
            }

            .filter-text, .sort-text {
                font-size: 0.875rem;
            }

            .filter-btn-inner, .sort-btn-inner {
                padding: 0;
                gap: 16px;
            }

            .filter-icon, .sort-icon {
                width: 1.125rem;
                height: 1.125rem;
                padding: 0;
                flex-shrink: 0;
                margin: 0;
            }

            .filter-btn-inner, .sort-btn-inner {
                padding: 8px 10px;
                gap: 4px;
            }

            .dropdown-item {
                font-size: 0.8125rem;
                padding: 8px 12px;
            }

            .filter-search {
                padding: 4px 12px;
            }

            .filter-search-input {
                font-size: 0.8125rem;
                padding: 6px 8px;
            }

            .filter-result-item, .filter-status-item {
                font-size: 0.8125rem;
                padding: 6px 8px;
            }

            .apply-btn, .reset-filters-btn {
                font-size: 0.8125rem;
                padding: 6px 10px;
            }

            .reset-filters-icon {
                width: 14px;
                height: 14px;
            }
        }

        /* Модальное окно создания проекта */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            align-items: stretch;
            justify-content: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .create-project-modal {
            background: rgba(4, 9, 16, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid #000000;
            border-radius: 0;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            overflow-y: auto;
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            gap: 8px;
            align-items: center;
            height: 24px;
        }

        .modal-back-btn {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .modal-back-btn svg {
            width: 100%;
            height: 100%;
        }

        .modal-title {
            color: #E1EAF8;
            font-size: 1.25rem;
            font-weight: 400;
            font-family: 'Involve', Arial, sans-serif;
            flex: 1;
        }

        .modal-field {
            display: flex;
            gap: 24px;
            align-items: center;
            color: #E1EAF8;
        }

        .modal-field-label {
            font-size: 1.25rem;
            font-weight: 400;
            font-family: 'Involve', Arial, sans-serif;
            width: 168px;

        // Функция для затемнения цвета на 50%
        function darkenColor(hex, percent = 50) {
            // Убираем #
            hex = hex.replace('#', '');
            
            // Конвертируем в RGB
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            
            // Затемняем
            const newR = Math.floor(r * (1 - percent / 100));
            const newG = Math.floor(g * (1 - percent / 100));
            const newB = Math.floor(b * (1 - percent / 100));
            
            // Конвертируем обратно в hex
            return '#' + [newR, newG, newB].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        // Обновление скроллбара
        function updateScrollbar() {
            const textarea = document.getElementById('project-description-input');
            const scrollbar = document.querySelector('.modal-description-scrollbar');
            const thumb = document.querySelector('.modal-description-scrollbar-thumb');
            
            if (!textarea || !scrollbar || !thumb) return;

            const scrollHeight = textarea.scrollHeight;
            const clientHeight = textarea.clientHeight;
            const scrollTop = textarea.scrollTop;
            const scrollbarHeight = scrollbar.clientHeight;

            // Проверяем, нужен ли скроллбар
            if (scrollHeight <= clientHeight) {
                thumb.style.display = 'none';
                return;
            } else {
                thumb.style.display = 'block';
            }

            // Вычисляем размер и позицию бегунка
            const thumbHeight = Math.max(48, (clientHeight / scrollHeight) * scrollbarHeight);
            const maxThumbTop = scrollbarHeight - thumbHeight;
            const thumbTop = (scrollTop / (scrollHeight - clientHeight)) * maxThumbTop;

            thumb.style.height = thumbHeight + 'px';
            thumb.style.top = thumbTop + 'px';
        }

            const projectDescription = descriptionInput.value.trim();

            if (!projectName) {

                return;
            }

            if (editingProjectId === null) {
                // Если почему-то нет ID, создаем новый проект
                submitCreateProject();
                return;
            }

            // Находим проект для обновления
            const projectIndex = projects.findIndex(p => p.id === editingProjectId);
            if (projectIndex === -1) {
                alert('Проект не найден');
                return;
            }

            // Обновляем проект
            projects[projectIndex] = {
                ...projects[projectIndex],
                name: projectName,
                description: projectDescription || 'Описание не указано',
                icon: selectedIcon,
                color: selectedColor,
                updatedAt: new Date().toISOString()
            };

            // Обновляем отображение проектов
            renderProjects();

            // Закрываем модальное окно
            closeCreateProjectModal();

            console.log('Проект обновлен:', projects[projectIndex]);
        }

                                    <circle cx="1.5" cy="12.5" r="1.5" fill="#292D32"/>
                                </svg>
                                <div class="project-card-context-menu">
                                    <div class="project-card-context-item" data-action="edit">
                                        <span>изменить</span>
                                    </div>
                                    <div class="project-card-context-item delete" data-action="delete">
                                        <span>удалить</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="project-card-description">${escapeHtml(project.description)}</div>
                    <div class="project-card-footer">
                        <span class="project-card-manager-label">руководит:</span>
                        <span class="project-card-manager-name">${escapeHtml(managerName)}</span>
                    </div>
                `;

                // Обработчик клика на меню
                const menuBtn = projectCard.querySelector('.project-card-menu');
                const contextMenu = projectCard.querySelector('.project-card-context-menu');
                
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Закрываем все другие контекстные меню
                    document.querySelectorAll('.project-card-context-menu.active').forEach(menu => {
                        if (menu !== contextMenu) {
                            menu.classList.remove('active');
                        }
                    });
                    // Переключаем текущее меню
                    contextMenu.classList.toggle('active');
                });

                // Обработчики действий в контекстном меню
                const editBtn = projectCard.querySelector('[data-action="edit"]');
                const deleteBtn = projectCard.querySelector('[data-action="delete"]');

                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    contextMenu.classList.remove('active');
                    editProject(project.id);
                });

                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    contextMenu.classList.remove('active');
                    deleteProject(project.id);
                });

                projectsGrid.appendChild(projectCard);
            });
        }

        // Функция для экранирования HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Закрытие модального окна по Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeCreateProjectModal();
            }
        });

        // Инициализация скроллбара при изменении размера текстового поля
        const descriptionInput = document.getElementById('project-description-input');
        if (descriptionInput) {
            // Обновляем скроллбар при изменении содержимого
            descriptionInput.addEventListener('input', function() {
                setTimeout(updateScrollbar, 10);
            });

            // Добавляем обработчик для перетаскивания скроллбара
            let isDragging = false;
            let startY = 0;
            let startScrollTop = 0;

            const scrollbar = document.querySelector('.modal-description-scrollbar');
            const thumb = document.querySelector('.modal-description-scrollbar-thumb');

            if (scrollbar && thumb) {
                // Клик на скроллбар для прокрутки
                scrollbar.addEventListener('click', function(e) {
                    if (e.target === scrollbar) {
                        const rect = scrollbar.getBoundingClientRect();
                        const clickY = e.clientY - rect.top;
                        const scrollbarHeight = scrollbar.clientHeight;
                        const scrollHeight = descriptionInput.scrollHeight;
                        const clientHeight = descriptionInput.clientHeight;
                        const scrollRatio = clickY / scrollbarHeight;
                        descriptionInput.scrollTop = (scrollHeight - clientHeight) * scrollRatio;
                        updateScrollbar();
                    }
                });

                // Начало перетаскивания
                thumb.addEventListener('mousedown', function(e) {
                    isDragging = true;
                    startY = e.clientY;
                    startScrollTop = descriptionInput.scrollTop;
                    e.preventDefault();
                });

                // Перетаскивание
                document.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;

                    const scrollbar = document.querySelector('.modal-description-scrollbar');
                    if (!scrollbar) return;

                    const rect = scrollbar.getBoundingClientRect();
                    const deltaY = e.clientY - startY;
                    const scrollbarHeight = scrollbar.clientHeight;
                    const scrollHeight = descriptionInput.scrollHeight;
                    const clientHeight = descriptionInput.clientHeight;
                    const scrollRatio = deltaY / scrollbarHeight;
                    const scrollDelta = (scrollHeight - clientHeight) * scrollRatio;
                    
                    descriptionInput.scrollTop = Math.max(0, Math.min(scrollHeight - clientHeight, startScrollTop + scrollDelta));
                    updateScrollbar();
                });

                // Конец перетаскивания
                document.addEventListener('mouseup', function() {
                    isDragging = false;
                });
            }
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            restoreFilterSelection();
            restoreSortSelection();
            // Статусы и пользователи будут загружены при открытии соответствующих подменю
            initIconColorSelectors();
            renderProjects();
        });
    </script>
</body>
</html>
