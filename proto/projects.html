<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Managelog - Шапка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Involve';
            src: local('Arial'), local('Helvetica');
            font-weight: 500;
        }

        @font-face {
            font-family: 'Involve';
            src: local('Arial'), local('Helvetica');
            font-weight: 700;
        }

        body {
            font-family: 'Involve', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header-container {
            max-width: 95vw;
            margin: 0 auto;
            position: relative;
            height: 71px;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 71px;
            background: rgba(145, 33, 56, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
        }

        .header-content {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        /* Логотип */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-left: 0px;
        }

        .logo-circle {
            width: 55px;
            height: 55px;
            background: #E1EAF8;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 700;
            color: #E1EAF8;
            white-space: nowrap;
        }

        /* Навигация */
        .nav-menu {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 0;
            align-items: center;
        }

        .nav-item {
            width: 150px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            color: #E1EAF8;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            text-decoration: none;
        }

        .nav-item.active {
            background-image: url('../public/images/backgrounds/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
        }

        /* Правая секция */
        .right-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .notification-btn {
            width: 40px;
            height: 40px;
            background: #912138;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .notification-icon {
            width: 28px;
            height: 28px;
            fill: #E1EAF8;
        }

        .checkin-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #912138;
            border-radius: 80px;
            padding: 0 20px;
            height: 40px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkin-icon {
            width: 17px;
            height: 20px;
            fill: #E1EAF8;
        }

        .checkin-text {
            color: #E1EAF8;
            font-size: 20px;
            font-weight: 500;
            white-space: nowrap;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Адаптивность */
        @media (max-width: 1400px) {
            .header-container {
                max-width: 100%;
            }
        }

        @media (max-width: 1280px) {
            .logo-text {
                font-size: 40px;
            }

            .nav-item {
                width: 130px;
                font-size: 18px;
            }

            .checkin-text {
                font-size: 18px;
            }
        }

        @media (max-width: 1100px) {
            .logo-text {
                font-size: 36px;
            }

            .logo-circle {
                width: 45px;
                height: 45px;
            }

            .nav-item {
                width: 110px;
                font-size: 16px;
            }

            .checkin-text {
                font-size: 16px;
            }
        }

        @media (max-width: 900px) {
            .logo-text {
                font-size: 32px;
            }

            .nav-item {
                width: 100px;
                font-size: 15px;
            }

            .checkin-text {
                display: none;
            }

            .checkin-btn {
                padding: 0;
                width: 36px;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .logo-section {
                gap: 12px;
            }

            .logo-text {
                font-size: 28px;
            }

            .logo-circle {
                width: 40px;
                height: 40px;
            }

            .nav-menu {
                position: static;
                transform: none;
                flex: 1;
                justify-content: center;
                gap: 4px;
            }

            .header-content {
                gap: 12px;
            }

            .nav-item {
                width: 90px;
                font-size: 14px;
            }

            .right-section {
                gap: 8px;
            }
        }

        @media (max-width: 640px) {
            .logo-text {
                font-size: 24px;
            }

            .nav-item {
                width: 70px;
                font-size: 12px;
            }
        }

        /* Секция фильтров и сортировки */
        .filters-container {
            max-width: 95vw;
            margin: 24px auto 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .filters-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-btn, .sort-btn {
            background: rgba(145, 33, 56, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            overflow: visible;
            padding: 0;
        }

        .filter-btn {
            min-width: fit-content;
        }

        .sort-btn {
            min-width: fit-content;
        }

        .filter-btn-inner, .sort-btn-inner {
            background: #912138;
            border-radius: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            padding: 12px 24px;
            gap: 10px;
            flex-shrink: 0;
        }

        .filter-text, .sort-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: 500;
            white-space: nowrap;
            text-align: center;
        }

        .filter-icon, .sort-icon {
            width: 1.5rem;
            height: 1.5rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .filter-icon svg, .sort-icon svg {
            width: 100%;
            height: 100%;
            display: block;
            margin: 0;
        }

        .plus-icon {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plus-icon svg {
            width: 100%;
            height: 100%;
            stroke: #ffffff;
            fill: none;
        }

        .create-project-btn {
            background: #912138;
            border-radius: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            gap: 20px;
            cursor: pointer;
            min-width: fit-content;
        }

        .create-project-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: 500;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }

        /* Выпадающие меню */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: rgba(145, 33, 56, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 12px 0;
            min-width: 200px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            padding: 12px 24px;
            color: #E1EAF8;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .dropdown-item .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #E1EAF8;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dropdown-item.active .checkbox {
            border-color: #ffffff;
            background: #ffffff;
        }

        .dropdown-item .checkbox svg {
            width: 12px;
            height: 12px;
            stroke: #912138;
            fill: none;
            display: none;
        }

        .dropdown-item.active .checkbox svg {
            display: block;
            stroke: #912138;
        }

        .apply-btn {
            margin: 8px 12px 0;
            padding: 10px 20px;
            background: #912138;
            border-radius: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .apply-btn:hover {
            background: #a02a43;
        }

        .filter-btn .dropdown-menu {
            padding-bottom: 8px;
        }

        .sort-btn .dropdown-menu {
            min-width: 220px;
        }

        .filter-btn .dropdown-menu {
            min-width: 240px;
        }

        /* Адаптивность для секции фильтров */
        @media (max-width: 1280px) {
            .filter-text, .sort-text, .create-project-text {
                font-size: 18px;
            }

            .filter-btn-inner, .sort-btn-inner {
                padding: 12px 20px;
            }
        }

        @media (max-width: 1100px) {
            .filter-text, .sort-text, .create-project-text {
                font-size: 16px;
            }

            .filter-btn-inner, .sort-btn-inner {
                padding: 12px 18px;
            }
        }

        @media (max-width: 900px) {
            .filters-container {
                flex-wrap: wrap;
            }

            .create-project-btn {
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {
            .filters-container {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-left {
                width: 100%;
                justify-content: space-between;
            }

            .filter-btn, .sort-btn {
                flex: 1;
                max-width: 48%;
            }

            .filter-btn-inner, .sort-btn-inner {
                width: 100%;
            }

            .create-project-btn {
                width: 100%;
            }
        }
    </style>
</head>

    <!-- Секция фильтров и сортировки -->

        <div class="filters-left">
            <!-- Кнопка фильтров -->
            <div class="filter-btn" onclick="toggleDropdown('filters')">
                <div class="filter-btn-inner">
                    <span class="filter-text">фильтры</span>
                </div>
                <div class="filter-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                    </svg>
                </div>
                <div class="dropdown-menu" id="filters-menu">
                    <div class="dropdown-item" data-filter="executor" onclick="toggleFilter('executor', event)">
                        <span>исполнитель</span>
                        <div class="checkbox">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M10 3L4.5 8.5L2 6" stroke="#912138" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                    <div class="dropdown-item" data-filter="status" onclick="toggleFilter('status', event)">
                        <span>статус</span>
                        <div class="checkbox">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M10 3L4.5 8.5L2 6" stroke="#912138" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                    <div class="dropdown-item" data-filter="manager" onclick="toggleFilter('manager', event)">
                        <span>руководитель</span>
                        <div class="checkbox">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M10 3L4.5 8.5L2 6" stroke="#912138" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                    <div class="dropdown-item" data-filter="actions" onclick="toggleFilter('actions', event)">
                        <span>рекомендуются действия</span>
                        <div class="checkbox">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M10 3L4.5 8.5L2 6" stroke="#912138" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                    <div class="apply-btn" onclick="applyFilters(event)">применить</div>
                </div>
            </div>

            <!-- Кнопка сортировки -->
            <div class="sort-btn" onclick="toggleDropdown('sort')">
                <div class="sort-btn-inner">
                    <span class="sort-text">сортировка</span>
                </div>
                <div class="sort-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.293 4.29342C17.4651 4.1211 17.6941 4.01749 17.9371 4.00202C18.1802 3.98655 18.4205 4.0603 18.613 4.20942L18.707 4.29342L21.535 7.12142C21.7143 7.30138 21.8185 7.54286 21.8262 7.79681C21.834 8.05076 21.7448 8.29814 21.5768 8.4887C21.4087 8.67927 21.1744 8.79873 20.9215 8.82282C20.6686 8.84692 20.416 8.77384 20.215 8.61842L20.121 8.53542L19 7.41442V19.8284C18.9997 20.0833 18.9021 20.3285 18.7272 20.5138C18.5522 20.6991 18.313 20.8107 18.0586 20.8256C17.8042 20.8405 17.5536 20.7577 17.3582 20.5942C17.1627 20.4306 17.0371 20.1985 17.007 19.9454L17 19.8284V7.41442L15.879 8.53542C15.6995 8.71668 15.4574 8.82246 15.2025 8.83111C14.9475 8.83976 14.6988 8.75063 14.5074 8.58196C14.316 8.41329 14.1963 8.17784 14.1728 7.9238C14.1493 7.66976 14.2238 7.41635 14.381 7.21542L14.464 7.12142L17.293 4.29342ZM13 18.8284C13.2549 18.8287 13.5 18.9263 13.6854 19.1013C13.8707 19.2762 13.9822 19.5154 13.9972 19.7698C14.0121 20.0243 13.9293 20.2748 13.7657 20.4703C13.6021 20.6657 13.3701 20.7913 13.117 20.8214L13 20.8284H4C3.74512 20.8281 3.49997 20.7305 3.31463 20.5556C3.1293 20.3806 3.01777 20.1415 3.00283 19.887C2.98789 19.6326 3.07067 19.382 3.23426 19.1866C3.39786 18.9911 3.6299 18.8655 3.883 18.8354L4 18.8284H13ZM13 11.8284C13.2652 11.8284 13.5196 11.9338 13.7071 12.1213C13.8946 12.3089 14 12.5632 14 12.8284C14 13.0936 13.8946 13.348 13.7071 13.5355C13.5196 13.7231 13.2652 13.8284 13 13.8284H4C3.73478 13.8284 3.48043 13.7231 3.29289 13.5355C3.10536 13.348 3 13.0936 3 12.8284C3 12.5632 3.10536 12.3089 3.29289 12.1213C3.48043 11.9338 3.73478 11.8284 4 11.8284H13ZM11 4.82842C11.2652 4.82842 11.5196 4.93378 11.7071 5.12132C11.8946 5.30885 12 5.56321 12 5.82842C12 6.09364 11.8946 6.34799 11.7071 6.53553C11.5196 6.72307 11.2652 6.82842 11 6.82842H4C3.73478 6.82842 3.48043 6.72307 3.29289 6.53553C3.10536 6.34799 3 6.09364 3 5.82842C3 5.56321 3.10536 5.30885 3.29289 5.12132C3.48043 4.93378 3.73478 4.82842 4 4.82842H11Z" fill="white"/>
                    </svg>
                </div>
                <div class="dropdown-menu" id="sort-menu">
                    <div class="dropdown-item active" data-sort="activity" onclick="selectSort('activity', event)">
                        <span>активность</span>
                    </div>
                    <div class="dropdown-item" data-sort="created" onclick="selectSort('created', event)">
                        <span>дата создания</span>
                    </div>
                    <div class="dropdown-item" data-sort="alphabet" onclick="selectSort('alphabet', event)">
                        <span>алфавит</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопка создания проекта -->
        <div class="create-project-btn" onclick="createProject()">
            <span class="create-project-text">создать новый проект</span>
            <div class="plus-icon">
                <svg viewBox="0 0 18 18" fill="none">
                    <path d="M9 0V18M0 9H18" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        // Сохранение состояния фильтров и сортировки
        let selectedFilters = {
            executor: false,
            status: false,
            manager: false,
            actions: false
        };
        
        let selectedSort = 'activity'; // По умолчанию активность

        // Управление выпадающими меню
        function toggleDropdown(type) {
            const menu = document.getElementById(type === 'filters' ? 'filters-menu' : 'sort-menu');
            const otherMenu = document.getElementById(type === 'filters' ? 'sort-menu' : 'filters-menu');
            
            // Закрываем другое меню
            if (otherMenu) {
                otherMenu.classList.remove('active');
            }
            
            // Переключаем текущее меню
            menu.classList.toggle('active');
            
            // Если открываем меню, восстанавливаем выбранные значения
            if (menu.classList.contains('active')) {
                if (type === 'filters') {
                    restoreFilterSelection();
                } else {
                    restoreSortSelection();
                }
            }
        }

        // Восстановление выбранных фильтров
        function restoreFilterSelection() {
            const items = document.querySelectorAll('#filters-menu .dropdown-item[data-filter]');
            items.forEach(item => {
                const filterType = item.getAttribute('data-filter');
                if (selectedFilters[filterType]) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Восстановление выбранной сортировки
        function restoreSortSelection() {
            const items = document.querySelectorAll('#sort-menu .dropdown-item[data-sort]');
            items.forEach(item => {
                const sortType = item.getAttribute('data-sort');
                if (sortType === selectedSort) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Закрытие меню при клике вне его
        document.addEventListener('click', function(event) {
            const filtersBtn = document.querySelector('.filter-btn');
            const sortBtn = document.querySelector('.sort-btn');
            const filtersMenu = document.getElementById('filters-menu');
            const sortMenu = document.getElementById('sort-menu');
            const applyBtn = document.querySelector('.apply-btn');

            // Игнорируем клики внутри меню
            if (applyBtn && applyBtn.contains(event.target)) {
                return;
            }

            if (filtersBtn && !filtersBtn.contains(event.target) && filtersMenu) {
                filtersMenu.classList.remove('active');
            }

            if (sortBtn && !sortBtn.contains(event.target) && sortMenu) {
                sortMenu.classList.remove('active');
            }
        });

        // Переключение фильтра (мультивыбор)
        function toggleFilter(filterType, e) {
            e = e || window.event;
            e.stopPropagation();
            
            const target = e.currentTarget || e.target.closest('.dropdown-item');
            const isActive = target.classList.contains('active');
            
            // Переключаем состояние
            if (isActive) {
                target.classList.remove('active');
                selectedFilters[filterType] = false;
            } else {
                target.classList.add('active');
                selectedFilters[filterType] = true;
            }
            
            console.log('Выбранные фильтры:', selectedFilters);
        }

        // Применение фильтров
        function applyFilters(e) {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            }
            
            const filtersMenu = document.getElementById('filters-menu');
            if (filtersMenu) {
                filtersMenu.classList.remove('active');
            }
            
            // Здесь будет логика применения фильтров
            console.log('Применены фильтры:', selectedFilters);
            
            // Визуальная индикация активных фильтров на кнопке
            const activeFiltersCount = Object.values(selectedFilters).filter(v => v).length;
            const filterText = document.querySelector('.filter-text');
            if (filterText) {
                if (activeFiltersCount > 0) {
                    filterText.textContent = `фильтры (${activeFiltersCount})`;
                } else {
                    filterText.textContent = 'фильтры';
                }
            }
        }

        // Выбор сортировки (моновыбор)
        function selectSort(sortType, e) {
            e = e || window.event;
            e.stopPropagation();
            
            const target = e.currentTarget || e.target.closest('.dropdown-item');
            const items = document.querySelectorAll('#sort-menu .dropdown-item[data-sort]');
            
            // Убираем активность со всех элементов
            items.forEach(item => item.classList.remove('active'));
            
            // Устанавливаем активность на выбранный
            target.classList.add('active');
            selectedSort = sortType;
            
            // Закрываем меню
            const sortMenu = document.getElementById('sort-menu');
            sortMenu.classList.remove('active');
            
            // Обновляем текст кнопки
            const sortText = document.querySelector('.sort-text');
            const sortNames = {
                'activity': 'активность',
                'created': 'дата создания',
                'alphabet': 'алфавит'
            };
            sortText.textContent = sortNames[sortType] || 'сортировка';
            
            // Здесь будет логика применения сортировки
            console.log('Выбрана сортировка:', sortType);
        }

        // Создание проекта
        function createProject() {
            // Здесь будет логика создания проекта
            console.log('Создание нового проекта');
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            restoreFilterSelection();
            restoreSortSelection();
        });
    </script>
</body>
</html>
